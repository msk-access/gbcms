[project]
name = "gbcms"
# The version is rust/Cargo.toml's (maturin converts it to PEP 440); see the release guide.
dynamic = ["version"]
description = "Python implementation of GetBaseCountsMultiSample (gbcms) for calculating base counts in BAM files"
authors = [
    {name = "MSK-ACCESS", email = "shahr2@mskcc.org"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["bioinformatics", "genomics", "bam", "vcf", "maf", "base-counts", "gbcms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Floors are measured: the suite passes with every one of them installed together
# (Python 3.10 and 3.11), and CI's floors leg keeps them so. typer below 0.15.4
# breaks under click >= 8.2; pysam 0.21 has no arm64 wheel and no buildable sdist.
dependencies = [
    "pysam>=0.22.0",
    "typer>=0.15.4",
    # click is the engine under typer; the CLI tests import it directly
    # (typer.main.get_command returns a click.Group). Pin it explicitly so the
    # built wheel carries it and CI's lock-bypassing wheel install resolves it.
    "click>=8.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "polars>=1.0.0",
]

[project.optional-dependencies]
fast = []

all = []

[project.scripts]
gbcms = "gbcms.cli:app"

[project.urls]
Homepage = "https://github.com/msk-access/gbcms"
Repository = "https://github.com/msk-access/gbcms"
Documentation = "https://msk-access.github.io/gbcms"
"Bug Tracker" = "https://github.com/msk-access/gbcms/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "gbcms._rs"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=gbcms",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Deprecation shim for the old `py-gbcms` name: the DeprecationWarning must be
# raised BEFORE re-exporting from `gbcms`, so the imports cannot sit at the top
# of the file. Ignore E402 here rather than excluding the file, so the shim
# still gets F/B/UP/I coverage.
"compat/py-gbcms/py_gbcms/__init__.py" = ["E402", "F401", "F403"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
[[tool.mypy.overrides]]
module = [
    "src.gbcms.models",
]
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = [
    "pysam.*",
    "pyarrow.*",
    "gbcms._rs",
    "helpers",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/gbcms"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[dependency-groups]
# Contributors' tools (PEP 735; not in the published metadata). `maturin develop`
# installs `dev`, which needs pip>=25.1 or uv. CI installs `test` for the suite and
# `dev` for lint.
test = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    # the observation tests read Parquet back with it
    "pyarrow",
    # the workflow-contract tests parse .github/workflows/*.yml
    "pyyaml>=6.0",
    # the contract tests parse pyproject.toml
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    {include-group = "test"},
    "black>=25.9.0",
    "ruff>=0.13.3",
    "mypy>=1.18.2",
    "types-pyyaml>=6.0.0",
    # MkDocs 2.0 is incompatible with Material and this site's config (anchor
    # validation, exclude_docs, snippets); the migration is D3 #138.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-print-site-plugin>=2.3.0",
]
