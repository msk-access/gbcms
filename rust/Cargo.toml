[package]
name = "gbcms_rs"
version = "6.7.0-dev.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
# No `curl` feature (a default one): htslib's remote files (http, https, s3, gcs) are not
# used, because the CLI only takes paths that exist. The feature pulls libcurl and, on
# Linux, OpenSSL 3 (curl 8 refuses OpenSSL 1.1.1) into every build, which a wheel for
# RHEL 8 (manylinux_2_28, glibc 2.28) cannot get from the system. bzip2 and lzma stay
# for CRAM.
rust-htslib = { version = "1.0", default-features = false, features = ["bzip2", "lzma"] }
thiserror = "2.0"
anyhow = "1.0"
bio-types = "1.0"
rayon = "1.10"
bio = "~4.2"  # minor releases have changed numerics (4.1 fixed the PairHMM): re-measure before moving
log = "0.4"
pyo3-log = "0.13.4"
# Parquet writer for --mfsd-parquet: writes raw fragment size arrays natively
# from Rust, avoiding an FFI round-trip and the pyarrow dependency.
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
# WFA2 fast-path alignment for Phase 3 read classification triage.
# Pure Rust implementation from COMBINE-lab — no cmake dependency.
# NEON/AVX2 SIMD acceleration.
# No default features: those build its benchmark binary (clap, tracing, mimalloc
# as that binary's allocator); the library needs none of them.
wfa2lib-rs = { git = "https://github.com/COMBINE-lab/wfa2lib-rs", rev = "cb8aa3d6", default-features = false }
# Gzip decompression: REDIportal RNA editing DB (.txt.gz) and GTF (.gtf.gz, BGZF).
# zlib-rs (pure Rust) decodes the 1.46 GB GRCh38 GTF in ~0.5 s vs ~1 s for the
# default miniz_oxide backend; flate2 prefers it when both are enabled.
flate2 = { version = "1", features = ["zlib-rs"] }
# ── P4a: GTF-informed splice mask (v5.0.0) ─────────────────────────────────
# COITree: cache-oblivious interval tree for O(n+m) exon overlap queries.
coitrees = "0.4"
