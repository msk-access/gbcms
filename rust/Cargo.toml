[package]
name = "gbcms_rs"
version = "6.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_rs"
crate-type = ["cdylib"]

[features]
# `legacy-parity` exports the per-variant `count_bam` (the binned↔legacy parity
# oracle). On by default so dev/test builds keep it; release wheels build with
# `--no-default-features` to exclude it from the shipped surface (see Dockerfile,
# release.yml). Gated symbols: counting::count_bam, count_single_variant + their
# re-export (counting/mod.rs) and registration (lib.rs).
default = ["legacy-parity"]
legacy-parity = []

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module"] }
rust-htslib = "0.51.0"
thiserror = "2.0"
anyhow = "1.0"
bio-types = "1.0"
statrs = "0.18.0"  # For Fisher's exact test
rayon = "1.10"
bio = "3.0"
log = "0.4"
pyo3-log = "0.13.2"
# Parquet writer for --mfsd-parquet: writes raw fragment size arrays natively
# from Rust, avoiding an FFI round-trip and the pyarrow dependency.
arrow-array = { version = "53", default-features = false }
arrow-buffer = { version = "53", default-features = false }
arrow-schema = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "zstd"] }
# WFA2 fast-path alignment for Phase 3 read classification triage.
# Pure Rust implementation from COMBINE-lab — no cmake dependency.
# NEON/AVX2 SIMD acceleration.
wfa2lib-rs = { git = "https://github.com/COMBINE-lab/wfa2lib-rs", rev = "7d6ec921" }
# Gzip decompression for REDIportal RNA editing DB (.txt.gz support)
flate2 = "1"
# ── P4a: GTF-informed splice mask (v5.0.0) ─────────────────────────────────
# COITree: cache-oblivious interval tree for O(n+m) exon overlap queries.
coitrees = "0.4"
# noodles-gtf: pure-Rust GTF parser. No cmake dependency.
noodles-gtf = "0.37"
# ── M5a: GTF AnnotationIndex disk cache ────────────────────────────────────
# Serialize the *parsed intermediate* (exon records, splice sites, introns,
# chrom map) so repeated runs over the same GTF skip the ~8.7s text parse of a
# full Ensembl annotation. The arch-specific COITrees are NOT cached — they are
# rebuilt from the cached exon records on load (cheap). serde provides the
# derives; bincode is the compact binary codec.
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
