name: Wheels

# Builds the Linux wheel with the release recipe (.github/actions/linux-wheel) and
# installs it where users do: Rocky Linux 8 (glibc 2.28, as RHEL 8) and 9 (glibc 2.34).
# In each, pip must take the wheel (never the source distribution), the suite must pass,
# and a counting run on a synthetic data set must write the same bytes in every
# environment. Nothing is published.
#
# The "reference" wheel is the one earlier releases shipped (manylinux_2_34). Its
# outputs on Rocky 9 are the baseline the manylinux_2_28 wheel must match, byte for byte,
# on Rocky 8 and Rocky 9. Delete the reference once a release has shipped the
# manylinux_2_28 wheel.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'rust/**'
      - 'pyproject.toml'
      - 'scripts/check_wheel.sh'
      - 'scripts/wheel_fixture_run.py'
      - '.github/actions/linux-wheel/**'
      - '.github/workflows/wheels.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'rust/**'
      - 'pyproject.toml'
      - 'scripts/check_wheel.sh'
      - 'scripts/wheel_fixture_run.py'
      - '.github/actions/linux-wheel/**'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.manylinux }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manylinux: [ manylinux_2_28, manylinux_2_34 ]
    steps:
      - uses: actions/checkout@v5
      - name: Build the wheel
        uses: ./.github/actions/linux-wheel
        with:
          manylinux: ${{ matrix.manylinux }}
          commit: ${{ github.sha }}
      - name: The wheel
        run: |
          ls -l dist
          # a wheel that tags itself for a newer glibc than its container's would
          # not install on RHEL 8: the name must carry the container's tag
          ls dist | grep -F "${{ matrix.manylinux }}_x86_64.whl"
      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.manylinux }}
          path: dist
          if-no-files-found: error

  rocky:
    name: Rocky Linux ${{ matrix.rocky }}, ${{ matrix.manylinux }} wheel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rocky: '8', manylinux: manylinux_2_28, suite: '1' }
          - { rocky: '9', manylinux: manylinux_2_28, suite: '1' }
          # the reference: earlier releases' wheel; only its outputs are compared
          - { rocky: '9', manylinux: manylinux_2_34, suite: '0' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.manylinux }}
          path: dist
      - name: Install and test the wheel
        env:
          ROCKY: ${{ matrix.rocky }}
          MANYLINUX: ${{ matrix.manylinux }}
          RUN_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p digests
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -e RUN_SUITE -e ROCKY -e MANYLINUX \
            "quay.io/rockylinux/rockylinux:$ROCKY" \
            bash -euo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False python3.11 python3.11-pip git-core
              # the checkout belongs to the runner user, not to root
              git config --global --add safe.directory /repo
              bash scripts/check_wheel.sh dist python3.11 "digests/${MANYLINUX}-rocky${ROCKY}.txt"
            '
      - name: Upload the output digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.manylinux }}-rocky${{ matrix.rocky }}
          path: digests
          if-no-files-found: ignore

  compare:
    name: The outputs are the same everywhere
    needs: rocky
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - name: Compare
        run: |
          cd digests
          ls -l
          test "$(ls | wc -l)" -eq 3
          for f in *.txt; do echo "== $f"; cat "$f"; done
          for f in *.txt; do diff -u manylinux_2_34-rocky9.txt "$f"; done
          echo "All outputs are byte-identical."
