name: Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.gitbook.yaml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.gitbook.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range (3.10 with every runtime dependency at its
        # declared floor, so the floors stay true; 3.14), the Docker image's 3.11, and
        # macOS. The monthly latest-deps workflow runs every version.
        include:
          - {os: ubuntu-latest, python-version: '3.10', floors: true}
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.12'}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libreadline-dev \
            libxml2-dev \
            libxslt1-dev \
            gfortran \
            libopenblas-dev \
            liblapack-dev \
            git \
            autoconf \
            samtools

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install htslib samtools autoconf automake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install package and test basic functionality
        env:
          FLOORS: ${{ matrix.floors }}
        run: |
          # Install maturin to build the unified Python+Rust package
          uv pip install --system maturin

          # Build wheel and install (works without virtualenv)
          maturin build --release --out dist
          if [ "$FLOORS" = "true" ]; then
            # Every runtime dependency at its declared floor, first: lowest-direct
            # keeps an installed version that satisfies a floor. Then the test tools,
            # a check that the floors are what is installed, and gbcms on top
            # without re-resolving them.
            uv pip install --system --resolution lowest-direct -r pyproject.toml
            uv pip install --system --group test
            python scripts/check_floors.py
            uv pip install --system --no-deps dist/*.whl
          else
            uv pip install --system --group test
            uv pip install --system dist/*.whl
          fi
          python -m pip check
          python -m pip list --format=freeze | grep -i -E '^(pysam|typer|click|rich|pydantic|polars)=='
          gbcms --help

      - name: Run tests with coverage
        run: |
          pytest --cov=gbcms --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        # A Codecov outage must not fail the tests' job: fail_ci_if_error covers
        # upload errors, but the action can crash before it applies (a TLS
        # handshake failure to Codecov, 2026-10-05).
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # One version source per ecosystem (rust/Cargo.toml for the package, the
      # Nextflow manifest for the pipeline); the release guide lists the locations.
      - name: Check version sources
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python scripts/release.py check --branch "$BRANCH"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          uv pip install --system maturin
          
          # Build and install the Rust extension
          cd rust
          maturin build --release
          uv pip install --system target/wheels/*.whl
          cd ..
          
          uv pip install --system -e . --group dev

      - name: Run black
        run: |
          black --check src/ tests/

      - name: Run ruff
        run: |
          ruff check src/ tests/

      - name: Run mypy
        run: |
          mypy src/

      # Rust lint gate. Clippy is check-only (no final link), so it runs cleanly on
      # Linux. Warnings fail the build.
      - name: Run clippy
        run: |
          cd rust && cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust unit tests (cargo test)
    # Runs on macOS deliberately: this pyo3 `extension-module` crate links `cargo test`
    # binaries the way the shipped extension does, and on Linux the test binary can't
    # resolve the Python symbols (no libpython host at link time), so the ~210 Rust
    # `#[cfg(test)]` unit tests run here. The ARM runner also exercises the Neon COITree
    # backend the annotation index uses. (Linux compilation is covered by the maturin builds
    # in the `test`/`docker-test` jobs; the binning-invariance checks are Python-level —
    # helpers.count_checked and tests/test_binning_invariance.py — and run under pytest in
    # the `test` job, beside the bin-builder property test here.)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install htslib (rust-htslib build dependency)
        run: |
          brew install htslib autoconf automake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The ~210 Rust unit tests (mFSD stats, GTF line grammar, thread-budget guard,
      # alignment/CIGAR, WFA, contig normalization, bin geometry, …) — logic not reached
      # through the Python FFI tests.
      - name: Cargo test (Rust unit tests)
        run: |
          cd rust && cargo test

  docker-test:
    name: docker-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          # GitHub's arm64 runner: the image is built and run natively, never under QEMU
          - { arch: arm64, runner: ubuntu-24.04-arm }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: gbcms:test
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.arch }}

      - name: Run the image
        run: |
          docker images gbcms:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          # The image is the runner's architecture, not an emulated one.
          test "$(docker image inspect gbcms:test --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          # The CLI starts, and the locked dependencies satisfy gbcms's requirements.
          docker run --rm gbcms:test --version
          docker run --rm --entrypoint python gbcms:test -m pip check

      # A counting run on a synthetic data set (scripts/wheel_fixture_run.py), whose output
      # digests are printed. The architectures must write the same bytes, and so must
      # Apptainer below: Docker's run is the reference.
      - name: A counting run in the image
        run: |
          set -euo pipefail
          mkdir -p work/docker digests
          docker run --rm -v "$PWD/scripts:/scripts:ro" -v "$PWD/work/docker:/work" \
            --entrypoint python gbcms:test /scripts/wheel_fixture_run.py /work/fixture > work/docker.txt
          cat work/docker.txt
          cp work/docker.txt "digests/${{ matrix.arch }}.txt"

      - name: Upload the output digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: digests
          if-no-files-found: error

      # How a RHEL cluster runs the image (the Nextflow singularity, slurm and iris
      # profiles): Apptainer, from a SIF built from the local image. Unlike Docker, it runs
      # as the caller, on a read-only filesystem, with the caller's HOME and environment in
      # the container and the data folders bound in (what Nextflow's autoMounts does).
      # The clusters are x86_64, so this runs on the amd64 leg.
      - name: Install Apptainer
        if: matrix.arch == 'amd64'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          # Ubuntu 24.04 blocks the unprivileged user namespaces Apptainer runs in
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          apptainer --version

      - name: Run the image under Apptainer
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          mkdir -p work/apptainer
          # A package in the caller's HOME, which Apptainer binds into the container: a
          # Python imports it before the image's own unless the image turns the user site
          # off. The folder is the one the image's own Python reads, for this HOME (so a
          # new Python in the image moves the trap with it). The Docker runs do not see HOME.
          site_dir="$(docker run --rm -e HOME="$HOME" --entrypoint python gbcms:test \
            -c 'import site; print(site.getusersitepackages())')"
          case "$site_dir" in
            "$HOME"/*) ;;
            *) echo "the image's user site $site_dir is not under HOME $HOME" >&2; exit 1 ;;
          esac
          decoy="$site_dir/pydantic"
          mkdir -p "$decoy"
          echo 'raise ImportError("imported from the caller HOME, not from the image")' > "$decoy/__init__.py"

          apptainer build gbcms.sif docker-daemon://gbcms:test
          # The trap is live: with the image's setting undone, its Python imports the decoy.
          # Without this, a trap in the wrong folder would pass for a guard that works.
          if apptainer exec gbcms.sif env -u PYTHONNOUSERSITE python -c 'import pydantic' 2> work/decoy.err; then
            echo "the decoy is not where the image's Python looks" >&2
            exit 1
          fi
          grep -q "imported from the caller HOME" work/decoy.err
          # exec, through bash, in the read-only SIF with the data folders bound, as a task runs
          apptainer exec gbcms.sif gbcms --version
          apptainer exec gbcms.sif python -m pip check
          apptainer exec -B "$PWD/scripts:/scripts:ro" -B "$PWD/work/apptainer:/work" gbcms.sif \
            /bin/bash -c 'python /scripts/wheel_fixture_run.py /work/fixture' > work/apptainer.txt

          diff -u work/docker.txt work/apptainer.txt
          echo "The outputs under Apptainer equal the Docker run's."

  docker-compare:
    name: The image counts the same on both architectures
    needs: docker-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          merge-multiple: true
          path: digests
      - name: Compare
        run: |
          cd digests
          test "$(ls | wc -l)" -eq 2
          for f in *.txt; do echo "== $f"; cat "$f"; done
          diff -u amd64.txt arm64.txt
          echo "amd64 and arm64 write the same bytes."
