name: Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.gitbook.yaml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.gitbook.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libreadline-dev \
            libxml2-dev \
            libxslt1-dev \
            gfortran \
            libopenblas-dev \
            liblapack-dev \
            git \
            autoconf \
            samtools

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install htslib samtools autoconf automake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install package and test basic functionality
        run: |
          # Install maturin to build the unified Python+Rust package
          uv pip install --system maturin
          
          # Build wheel and install (works without virtualenv)
          maturin build --release --out dist
          uv pip install --system dist/*.whl
          
          # Install dev dependencies  
          uv pip install --system pytest pytest-cov pytest-mock pyarrow
          gbcms --help

      - name: Run tests with coverage
        run: |
          pytest --cov=gbcms --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run integration tests (Ubuntu only)
        if: matrix.os == 'Linux'
        run: |
          chmod +x scripts/test_vcf_workflow.sh scripts/test_maf_workflow.sh scripts/test_docker.sh
          # Skip integration tests that require cyvcf2 on Ubuntu
          echo "⚠️  Skipping integration tests on Ubuntu due to htslib dependency issues"
          # bash scripts/test_docker.sh  # Only run Docker test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          uv pip install --system scipy-stubs maturin
          
          # Build and install the Rust extension
          cd rust
          maturin build --release
          uv pip install --system target/wheels/*.whl
          cd ..
          
          uv pip install --system -e ".[dev]"

      - name: Run black
        run: |
          black --check src/ tests/

      - name: Run ruff
        run: |
          ruff check src/ tests/

      - name: Run mypy
        run: |
          mypy src/

      # Rust lint gate. Clippy is check-only (no final link), so it runs cleanly on
      # Linux. Both feature configs are linted: default (dev/test, `legacy-parity` on)
      # and the shipped-wheel config (`--no-default-features`). Warnings fail the build.
      - name: Run clippy (default features)
        run: |
          cd rust && cargo clippy --all-targets -- -D warnings
      - name: Run clippy (no-default-features — shipped-wheel config)
        run: |
          cd rust && cargo clippy --lib --no-default-features -- -D warnings

  rust-test:
    name: Rust unit tests (cargo test)
    # Runs on macOS deliberately: this pyo3 `extension-module` crate links `cargo test`
    # binaries the way the shipped extension does, and on Linux the test binary can't
    # resolve the Python symbols (no libpython host at link time), so the ~210 Rust
    # `#[cfg(test)]` unit tests run here. The ARM runner also exercises the Neon COITree
    # backend the GTF cache rebuilds. (Linux compilation is covered by the maturin builds
    # in the `test`/`docker-test` jobs; the binned↔legacy *parity* assertions are
    # Python-level — helpers.count_both — and already run under pytest in the `test` job.)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install htslib (rust-htslib build dependency)
        run: |
          brew install htslib autoconf automake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The ~210 Rust unit tests (mFSD stats, GTF-cache roundtrip, thread-budget guard,
      # alignment/CIGAR, WFA, contig normalization, …) — logic not reached through the
      # Python FFI tests. Default features keep `legacy-parity` ON so the `count_bam`
      # path also compiles under test. This is the gate that was missing.
      - name: Cargo test (default features — Rust unit tests)
        run: |
          cd rust && cargo test

      # The shipped wheel builds `--no-default-features` (no `count_bam`); confirm that
      # configuration compiles and its tests pass too.
      - name: Cargo test (no-default-features — shipped-wheel config)
        run: |
          cd rust && cargo test --lib --no-default-features

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gbcms:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Verify Docker build success
        run: |
          # Check that the image was built successfully
          docker images gbcms:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo "✅ Docker image gbcms:test built successfully"

