name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Matches 1.0.0, 2.3.4, etc.
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

# The default token reads only; each job that writes asks for its own permissions.
permissions:
  contents: read

jobs:
  # Nothing builds or publishes until the version sources agree with the tag:
  # rust/Cargo.toml (the package), Cargo.lock, the Nextflow manifest (the pipeline's
  # image) and a dated CHANGELOG section. Publishing runs only on a tag push; a manual
  # run (workflow_dispatch) builds and checks but publishes nothing. The ref name
  # reaches the shell through env, never pasted into the script.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check version sources against the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release.py check --tag "$TAG"
      - name: Check version sources
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/release.py check

  # Build unified wheels (Python + Rust bundled) for Linux, inside a manylinux_2_28
  # container (AlmaLinux 8, glibc 2.28): the wheel installs on RHEL 8 and newer. The
  # recipe is the local action .github/actions/linux-wheel, which wheels.yml builds
  # with too, so what that workflow installs on Rocky Linux 8 and 9 is what is published.
  linux:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheels
        uses: ./.github/actions/linux-wheel
        with:
          manylinux: manylinux_2_28
          commit: ${{ github.sha }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # Build the unified wheel for macOS on Apple silicon (arm64, macOS 11 and newer). The
  # recipe is the local action .github/actions/macos-wheel, which wheels.yml builds with
  # too, so what that workflow installs on a macOS runner is what is published. Intel
  # Macs build the source distribution.
  macos:
    runs-on: macos-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # the tools the test job installs before it builds (bundled htslib is built from C)
      - name: Install build tools
        run: brew install autoconf automake

      - name: Build wheels
        uses: ./.github/actions/macos-wheel
        with:
          commit: ${{ github.sha }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist

  # Build source distribution (for the platforms without a wheel: Intel Macs, Windows, Linux aarch64)
  sdist:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Publish to PyPI
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write  # Required for PyPI Trusted Publisher OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: List wheels
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
          print-hash: true

  # Build the Docker image natively on each architecture (the arm64 job runs on GitHub's
  # arm64 runner, so nothing is emulated) and push each by digest, without a tag. A manual
  # run builds both and pushes nothing. The next job joins the two into one tag.
  docker:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, linux]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GBCMS_BUILD_COMMIT=${{ github.sha }}
          # untagged, by digest: the merge job adds the tags
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}

      - name: Keep the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # Join the two architectures' images into one multi-arch image under the release tag
  # and `latest`. Pulling the tag on Apple silicon or on a Linux arm64 host gets the arm64
  # image; everything else gets amd64.
  docker-merge:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create the multi-arch tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # both architectures must be there: a tag with one is not multi-arch
          test "$(ls digests | wc -l)" -eq 2
          tag_args=()
          while read -r tag; do
            if [ -n "$tag" ]; then tag_args+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # The GitHub Release page, once PyPI and the image are published: the title and
  # notes from the tag's CHANGELOG section, the wheels and sdist attached with their
  # SHA-256 sums, and a build-provenance attestation for each artifact.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, docker-merge]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write           # create the release and upload assets
      id-token: write           # sign the attestations (OIDC)
      attestations: write       # store them
      artifact-metadata: write  # the artifact storage records actions/attest creates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4  # a wrapper on actions/attest (SLSA provenance)
        with:
          subject-path: 'dist/*.whl, dist/*.tar.gz'
      - name: Release notes from the CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release.py notes --tag "$TAG" --title-out title.txt --notes-out notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          title="$(cat title.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi

  # Summary: what each publishing job did (re-run only the failed jobs: re-running all
  # rebuilds the wheel, whose checksums would no longer match the file PyPI kept).
  summary:
    runs-on: ubuntu-latest
    needs: [release, docker-merge, github-release]
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Show release summary
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PYPI: ${{ needs.release.result }}
          DOCKER: ${{ needs.docker-merge.result }}
          PAGE: ${{ needs.github-release.result }}
        run: |
          echo "PyPI:           $PYPI  https://pypi.org/project/gbcms/$TAG/"
          echo "Docker:         $DOCKER  ghcr.io/$REPO:$TAG"
          echo "GitHub Release: $PAGE  https://github.com/$REPO/releases/tag/$TAG"
          if [ "$PYPI $DOCKER $PAGE" = "success success success" ]; then
            echo "Release $TAG completed."
          else
            echo "Release $TAG incomplete: re-run the failed jobs."
            exit 1
          fi
