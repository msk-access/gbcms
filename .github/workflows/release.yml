name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Matches 1.0.0, 2.3.4, etc.
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

jobs:
  # Nothing builds or publishes until the version sources agree with the tag:
  # rust/Cargo.toml (the package), Cargo.lock, the Nextflow manifest (the pipeline's
  # image) and a dated CHANGELOG section. A manual run checks the sources only.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check version sources against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release.py check --tag "${{ github.ref_name }}"
      - name: Check version sources
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/release.py check

  # Build unified wheels (Python + Rust bundled) for Linux
  linux:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # Don't pass --manifest-path here; it's in pyproject.toml [tool.maturin]
          # Passing it on CLI causes maturin to use Cargo package name instead of pyproject.toml name
          args: --release --out dist -i python3.11
          # manylinux_2_34 uses AlmaLinux 9 with OpenSSL 3.0+ (compatible with curl-sys 0.4.85+)
          # RHEL 8 users should install from source in a conda env or use Docker
          manylinux: manylinux_2_34
          # docker-options ensures env vars are passed directly to the container
          # (before-script exports don't persist to cargo build phase)
          # GBCMS_BUILD_COMMIT: the commit for output provenance (rust/build.rs);
          # the manylinux container may not see the checkout's .git.
          docker-options: -e OPENSSL_NO_VENDOR=1 -e GBCMS_BUILD_COMMIT=${{ github.sha }}
          before-script-linux: |
            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
              SUDO="sudo"
            fi
            
            if command -v dnf &> /dev/null; then
              $SUDO dnf install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
            elif command -v yum &> /dev/null; then
              $SUDO yum install -y zlib-devel bzip2-devel xz-devel libcurl-devel openssl-devel clang llvm-devel
            elif command -v apt-get &> /dev/null; then
              $SUDO apt-get update && $SUDO apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev libssl-dev clang libclang-dev
            fi
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # Build source distribution (for macOS/Windows users to build from source)
  sdist:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Publish to PyPI
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [linux, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write  # Required for PyPI Trusted Publisher OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      
      - name: List wheels
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
          print-hash: true

  # Build and push Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [verify, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GBCMS_BUILD_COMMIT=${{ github.sha }}

  # The GitHub Release page, once PyPI and the image are published: the title and
  # notes from the tag's CHANGELOG section, the wheels and sdist attached with their
  # SHA-256 sums, and a build-provenance attestation for each artifact.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the attestations (OIDC)
      attestations: write  # store them
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.whl, dist/*.tar.gz'
      - name: Release notes from the CHANGELOG
        run: python scripts/release.py notes --tag "${{ github.ref_name }}" --title-out title.txt --notes-out notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          title="$(cat title.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi

  # Summary
  summary:
    runs-on: ubuntu-latest
    needs: [release, docker, github-release]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Show release summary
        run: |
          echo "✅ Release completed!"
          echo "📦 PyPI: https://pypi.org/project/gbcms/${{ github.ref_name }}/"
          echo "🐳 Docker: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}"
          echo "🏷️  Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
