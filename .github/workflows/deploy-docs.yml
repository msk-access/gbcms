name: documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 

      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          # The site's tools are pyproject's `docs` dependency group (MkDocs is
          # pinned below 2.0 there, D3 #138); --group needs pip>=25.1.
          python -m pip install --upgrade "pip>=25.1"
          pip install --group docs

      - name: Build documentation (PR check only)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Configure Git Credentials
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Sync gh-pages
        if: github.event_name == 'push'
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true

      # Deploy 'develop' branch as "dev" version
      - name: Deploy development docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mike deploy --push --update-aliases dev develop

      # Deploy 'main' branch as the stable version (e.g. "2.3.0")
      # and set it as the default landing page
      - name: Deploy stable docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # The version lives in rust/Cargo.toml (pyproject's is dynamic); the release
          # checker reads it, so the site is labelled with what the release shipped.
          VERSION=$(python scripts/release.py version)
          test -n "$VERSION"
          mike deploy --push --update-aliases "$VERSION" stable
          mike set-default --push stable
