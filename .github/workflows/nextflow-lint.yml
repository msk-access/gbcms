name: Nextflow Lint

# Catches Nextflow strict-syntax regressions (the parser that is the default from
# Nextflow 26.04). Strict-clean code is a subset of legacy-valid code, so linting
# on the pinned strict version also protects the 25.x runtime — one job covers both.
# Bump NXF_VER deliberately (a one-line PR) when adopting a newer Nextflow; this
# job in that PR then proves the pipeline still passes at the new version.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'nextflow/**'
      - '.github/workflows/nextflow-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'nextflow/**'
      - '.github/workflows/nextflow-lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NXF_VER: '26.04.0'   # pinned strict-parser version — bump deliberately
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Nextflow ${{ env.NXF_VER }}
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - name: Lint pipeline (strict syntax)
        run: nextflow lint nextflow/

      # The modules and banner read workflow.manifest.version (one source for the
      # pipeline's image): every process must resolve to the manifest's image.
      - name: Every process runs the manifest's image
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'sample,bam,bai\ns1,%s/s1.bam,%s/s1.bam.bai\n' "$tmp" "$tmp" > "$tmp/ss.csv"
          touch "$tmp/s1.bam" "$tmp/s1.bam.bai" "$tmp/ref.fa" "$tmp/ref.fa.fai"
          printf 'Hugo_Symbol\tChromosome\tStart_Position\tEnd_Position\tReference_Allele\tTumor_Seq_Allele2\tTumor_Sample_Barcode\nG\t1\t100\t100\tA\tT\ts1\n' > "$tmp/v.maf"
          manifest="$(sed -n "/^manifest/,/^}/s/^ *version *= *'\(.*\)'.*/\1/p" nextflow/nextflow.config)"
          want="ghcr.io/msk-access/gbcms:${manifest}"
          (cd "$tmp" && nextflow inspect "$GITHUB_WORKSPACE/nextflow/main.nf" --input ss.csv \
              --variants v.maf --fasta ref.fa --mode dna --outdir out -format json) > inspect.json
          cat inspect.json
          python3 - "$want" inspect.json <<'PY'
          import json, sys
          want, path = sys.argv[1], sys.argv[2]
          text = open(path).read()
          procs = json.loads(text[text.index("{"):])["processes"]
          bad = [p for p in procs if p.get("container") != want]
          assert procs and not bad, f"processes not on {want}: {bad}"
          print(f"{len(procs)} processes on {want}")
          PY
